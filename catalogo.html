<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo | Marcelão Imports</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="data/index_data/style.css?v=26">
    <style>
        html { scroll-behavior: smooth; }
        .badge-lancamento { background-color: #7209b7 !important; color: #fff !important; }
        .badge-oferta { background-color: #e63946 !important; color: #fff !important; }
        .badge-pouco-estoque { background-color: #fca311 !important; color: #111 !important; }
        .page-header { padding: 140px 20px 40px; text-align: center; background: linear-gradient(to bottom, #111 0%, #000 100%); }
        .btn-voltar { display: inline-block; margin-bottom: 20px; color: #d4af37; text-decoration: none; font-weight: 600; font-size: 0.9rem; border: 1px solid #d4af37; padding: 8px 20px; border-radius: 20px; transition: all 0.3s ease; }
        .btn-voltar:hover { background: #d4af37; color: #000; }
        .loading-catalog { text-align: center; padding: 50px; color: #d4af37; font-size: 1.2rem; font-weight: 600; width: 100%; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">
    <header>
        <div class="logo">
            <a href="index.html"><img src="data/index_data/logo.png" alt="Marcelão Imports"></a>
        </div>
        <nav>
            <a href="index.html#promocoes" data-i18n="nav_ofertas">Ofertas</a>
            <a href="catalogo.html" class="nav-highlight" data-i18n="nav_catalogo">Catálogo</a>
            <a href="index.html#referencias" data-i18n="nav_entregas">Entregas</a>
        </nav>
    </header>

    <div class="page-header">
        <a href="index.html" class="btn-voltar">➔ Voltar para Início</a>
        <h1 class="section-title" style="color: #fff;">Todos os Aparelhos</h1>
        <p style="color: #aaa; max-width: 600px; margin: 0 auto;">Navegue por todo o nosso estoque. Preços e condições exclusivas no WhatsApp.</p>
    </div>

    <section id="catalogo-completo" style="padding-top: 20px; padding-bottom: 60px;">
        <!-- Os produtos vão aparecer aqui magicamente puxados do Wix -->
        <div class="products-grid" id="catalogo-completo-grid">
            <div class="loading-catalog">⏳ Carregando catálogo completo...</div>
        </div>
    </section>

    <footer class="footer-section">
        <div class="footer-bottom" style="border-top: none; padding-top: 20px;">
            <p>&copy; 2026 Marcelão Distribuidor Imports. Todos os direitos reservados.</p>
        </div>
    </footer>

    <a href="#" onclick="chamarZap('Atendimento Catálogo Completo'); return false;" class="btn-whatsapp-float">
        <img src="data/redes_sociais/whatsapp.png" alt="WhatsApp" width="65" height="65">
        <span class="zap-badge">1</span>
    </a>

    <!-- Scripts Compartilhados -->
    <script src="whatsapp.js"></script>

    <!-- Script Global do WhatsApp Blindado -->
    <script>
        async function obterNumeroDoTxt() {
            try {
                const resposta = await fetch('whatsapp.txt?v=' + new Date().getTime());
                if (!resposta.ok) return null;
                const texto = await resposta.text();
                return texto.replace(/\D/g, '');
            } catch (erro) {
                return null;
            }
        }

        window.chamarZap = async function(produto) {
            let numero = await obterNumeroDoTxt();
            
            // Verifica o arquivo JS legado se existir
            if (typeof NUMERO_WHATSAPP !== 'undefined') { 
                let jsNum = NUMERO_WHATSAPP.replace(/\D/g, ''); 
                if (jsNum) numero = jsNum;
            }

            // BLINDAGEM: Se não achar nenhum número, trava a execução e avisa no console.
            if (!numero || numero.length < 10) {
                console.error("❌ ERRO GRAVE: Nenhum número válido encontrado. Abortando mensagem.");
                return; 
            }

            if (!numero.startsWith('55') && numero.length <= 11) { numero = '55' + numero; }

            // Lógica para marcar como Mais Buscado
            let cliques = JSON.parse(localStorage.getItem('cliquesProdutos')) || {};
            cliques[produto] = (cliques[produto] || 0) + 1;
            localStorage.setItem('cliquesProdutos', JSON.stringify(cliques));

            let lang = localStorage.getItem('siteLang') || 'pt';
            let msg = `Olá, Marcelão Imports! Tenho interesse no: ${produto}`;
            
            if (lang === 'es') msg = `¡Hola, Marcelão Imports! Estoy interesado en: ${produto}`;
            else if (lang === 'en') msg = `Hi, Marcelão Imports! I am interested in: ${produto}`;

            window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, '_blank');
        };
    </script>

    <!-- Script do Catálogo (Wix SDK) -->
    <script type="module">
        import { createClient, OAuthStrategy } from 'https://esm.sh/@wix/sdk@latest';
        import { products } from 'https://esm.sh/@wix/stores@latest';

        const CLIENT_ID = 'af0efa30-5a54-4813-a964-e064f08f8065';

        function formatarImagemWix(wixUrl) {
            if (!wixUrl) return 'https://via.placeholder.com/300x300/ffffff/555555?text=Sem+Imagem';
            if (wixUrl.startsWith('http')) return wixUrl;
            if (wixUrl.startsWith('wix:image://v1/')) {
                const arquivo = wixUrl.split('/')[3].split('#')[0];
                return `https://static.wixstatic.com/media/${arquivo}`;
            }
            return 'https://via.placeholder.com/300x300/ffffff/555555?text=Sem+Imagem';
        }

        async function carregarCatalogoCompleto() {
            const container = document.getElementById('catalogo-completo-grid');
            
            try {
                const wixClient = createClient({
                    modules: { products },
                    auth: OAuthStrategy({ clientId: CLIENT_ID })
                });

                // Aqui puxamos até 100 itens para listar o catálogo inteiro
                const resposta = await wixClient.products.queryProducts().limit(100).find();
                
                if (resposta.items.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #fff; padding: 20px;">Nenhum produto cadastrado na loja no momento.</div>';
                    return;
                }

                const imgStyle = `
                    width: 100%; 
                    aspect-ratio: 1 / 1; 
                    display: flex; 
                    justify-content: center; 
                    align-items: center; 
                    background: #ffffff; 
                    border-radius: 8px; 
                    margin-bottom: 12px; 
                    overflow: hidden;
                `;

                let htmlContent = '';

                resposta.items.forEach(p => {
                    let precoOriginal = p.priceData?.formatted?.price || '0,00';
                    let precoDesconto = p.priceData?.formatted?.discountedPrice;
                    
                    let pNovo = precoOriginal;
                    let pAntigo = null;

                    if (precoDesconto && precoDesconto !== precoOriginal) {
                        pNovo = precoDesconto;
                        pAntigo = precoOriginal;
                    }

                    pNovo = pNovo.replace('R$', '').replace('\u00A0', '').trim();
                    if (pAntigo) pAntigo = pAntigo.replace('R$', '').replace('\u00A0', '').trim();

                    const imgUrl = formatarImagemWix(p.media?.mainMedia?.image?.url || p.media?.items?.[0]?.image?.url);
                    const nome = p.name || 'Produto';
                    const desc = p.description ? p.description.replace(/<[^>]*>?/gm, '').substring(0, 65) + '...' : 'Qualidade e procedência garantida.';
                    const badge = p.ribbon || '';

                    // Construindo os blocos de HTML do produto
                    let badgeHtml = badge ? `<span class="badge-stock badge-lancamento">${badge}</span>` : '';
                    let priceHtml = pAntigo 
                        ? `<div class="price-box-highlight normal-price"><span class="price-old" style="font-size: 0.85rem; color:#888;">De R$ ${pAntigo}</span><span class="price-new" style="font-size: 1.5rem; color: #fff;">Por R$ ${pNovo}</span></div>`
                        : `<div class="price-box-highlight normal-price"><span class="price-new" style="font-size: 1.5rem; color: #fff;">R$ ${pNovo}</span></div>`;

                    htmlContent += `
                        <div class="product-card normal-card">
                            ${badgeHtml}
                            <div style="${imgStyle}">
                                <img src="${imgUrl}" alt="${nome}" style="width: 100%; height: 100%; object-fit: contain; padding: 10px;">
                            </div>
                            <h3 class="product-title">${nome}</h3>
                            <p class="product-desc">${desc}</p>
                            ${priceHtml}
                            <a href="#" class="btn-buy" onclick="chamarZap('${nome.replace(/'/g, "\\'")}'); return false;">Chamar no WhatsApp</a>
                        </div>
                    `;
                });

                container.innerHTML = htmlContent;

            } catch (e) {
                console.error("❌ Erro ao conectar com o Wix:", e);
                container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #fff; padding: 20px;">Ocorreu um erro ao carregar os produtos. Tente recarregar a página.</div>';
            }
        }

        document.addEventListener("DOMContentLoaded", carregarCatalogoCompleto);
    </script>
</body>
</html>
