<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados | Marcelão Imports</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="data/index_data/style.css?v=25">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html"><img src="data/index_data/logo.png" alt="Marcelão Imports" style="max-height: 40px;"></a>
        </div>
        <nav>
            <a href="index.html" data-i18n="nav_catalogo">⬅ Voltar ao Catálogo</a>
        </nav>
    </header>

    <section class="hero" style="padding: 40px 20px 20px; min-height: auto;">
        <div class="hero-content">
            <h2>Buscando por: <br><span class="gold-text" id="termo-buscado">...</span></h2>
        </div>
    </section>

    <!-- TELA DE CARREGAMENTO -->
    <div id="loading-container" class="loading-container">
        <div class="loading-dots">
            <div></div><div></div><div></div>
        </div>
        <p style="color: var(--gold); margin-top: 15px; font-weight: 600; font-size: 1.2rem;">Verificando estoque...</p>
    </div>

    <!-- SESSÃO DE RESULTADOS -->
    <section id="resultados-section" style="padding-bottom: 60px;">
        <div class="products-grid" id="resultados-grid" style="display: none;"></div>
        
        <div id="erro-busca" style="display: none; text-align: center; padding: 40px 20px; max-width: 600px; margin: 0 auto;">
            <!-- Preenchido via JS -->
        </div>
    </section>

    <!-- RODAPÉ DA PESQUISA -->
    <footer class="footer-section">
        <div class="footer-grid">
            <div class="footer-col company-info" style="text-align: center; width: 100%;">
                <p style="font-size: 0.8rem; color: #888; margin-bottom: 10px;" data-i18n="lang_label">Mudar Idioma do Site:</p>
                <div style="display: flex; gap: 15px; align-items: center; justify-content: center;">
                    <button class="lang-btn" data-lang="pt" onclick="mudarIdioma('pt')">🇧🇷 PT</button>
                    <button class="lang-btn" data-lang="es" onclick="mudarIdioma('es')">🇵🇾 ES</button>
                    <button class="lang-btn" data-lang="en" onclick="mudarIdioma('en')">🇺🇸 EN</button>
                </div>
            </div>
        </div>
    </footer>

    <!-- Botão Zap Direita -->
    <a href="#" onclick="chamarZap('Atendimento Geral'); return false;" class="btn-whatsapp-float">
        <img src="data/redes_sociais/whatsapp.png" alt="WhatsApp" width="65" height="65">
    </a>

    <script src="data/index_data/script.js"></script>
    <script>
        const bancoDeProdutos = [
            { nome: "iPhone 14 Pro 128GB", tags: "apple ios iphone 14 pro 128 celular smartphone seminovo", desc: "Seminovo Premium. Bateria 100%, impecável.", img: "data/phones/iphone14pro.png", promo: true, precoVelho: "De R$ 4.800,00", precoNovo: "Por R$ 4.299,00" },
            { nome: "Xiaomi 13T Pro", tags: "xiaomi 13t pro android leica smartwatch brinde", desc: "Câmeras Leica, 120W de carga e Smartwatch grátis.", img: "data/phones/xiaomi13t.png", promo: true, precoVelho: "De R$ 3.500,00", precoNovo: "Por R$ 3.100,00" },
            { nome: "PlayStation 5 Slim", tags: "ps5 playstation 5 slim sony videogame console", desc: "Versão com leitor de disco, lacrado, 1 ano de garantia.", img: "data/phones/ps5.png", promo: true, precoVelho: "De R$ 4.200,00", precoNovo: "Por R$ 3.750,00" },
            { nome: "iPhone 15 Pro 256GB", tags: "apple ios iphone 15 pro titanium", desc: "Titânio e desempenho absurdo.", img: "data/phones/iphone15pro.png", promo: false, precoNovo: "R$ 5.850,00" },
            { nome: "POCO X7 Pro 5G", tags: "xiaomi poco x7 pro gamer celular smartphone", desc: "O monstro do custo-benefício para jogos.", img: "data/phones/pocox7.png", promo: false, precoNovo: "R$ 1.950,00" }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        
        if(query) {
            document.getElementById('termo-buscado').innerText = '"' + query + '"';
            
            const q = query.toLowerCase().trim();
            const resultados = bancoDeProdutos.filter(p => p.nome.toLowerCase().includes(q) || p.tags.includes(q));
            
            const grid = document.getElementById('resultados-grid');
            const erro = document.getElementById('erro-busca');
            const loading = document.getElementById('loading-container');
            
            loading.style.display = 'block';

            setTimeout(() => {
                loading.style.display = 'none';

                if(resultados.length > 0) {
                    let htmlStr = '';
                    resultados.forEach(p => {
                        let btnAction = `chamarZap('${p.nome}')`;
                        
                        if(p.promo) {
                            htmlStr += `
                                <div class="product-card promo-card">
                                    <div class="promo-pulse-badge">🔥 Encontrado</div>
                                    <div class="product-img-container">
                                        <img src="${p.img}" alt="${p.nome}" class="phone-mockup" onerror="this.src='https://via.placeholder.com/200x200/1a1a1a/444444?text=Sem+Foto'">
                                    </div>
                                    <h3 class="product-title">${p.nome}</h3>
                                    <p class="product-desc">${p.desc}</p>
                                    <div class="price-box-highlight">
                                        <span class="price-old">${p.precoVelho}</span>
                                        <span class="price-new">${p.precoNovo}</span>
                                    </div>
                                    <a href="#" class="btn-buy btn-promo" onclick="${btnAction}; return false;" data-i18n="btn_oferta">Garantir Oferta</a>
                                </div>
                            `;
                        } else {
                            htmlStr += `
                                <div class="product-card normal-card">
                                    <div class="product-img-container">
                                        <img src="${p.img}" alt="${p.nome}" class="phone-mockup" onerror="this.src='https://via.placeholder.com/200x200/1a1a1a/444444?text=Sem+Foto'">
                                    </div>
                                    <h3 class="product-title">${p.nome}</h3>
                                    <p class="product-desc">${p.desc}</p>
                                    <div class="price-box-highlight normal-price">
                                        <span class="price-new" style="font-size: 1.5rem; color: #fff;">${p.precoNovo}</span>
                                    </div>
                                    <a href="#" class="btn-buy" onclick="${btnAction}; return false;" data-i18n="btn_zap">Chamar no WhatsApp</a>
                                </div>
                            `;
                        }
                    });
                    grid.innerHTML = htmlStr;
                    grid.style.display = 'grid';
                    // Reaplica idioma nos botões renderizados
                    inicializarIdioma();
                } else {
                    let lang = localStorage.getItem('siteLang') || 'pt';
                    let msgErro = `Olá, vocês têm o produto ${query} no estoque?`;
                    if (lang === 'es') msgErro = `Hola, ¿tienen el producto ${query} en stock?`;
                    if (lang === 'en') msgErro = `Hi, do you have the product ${query} in stock?`;
                    
                    let linkWppErro = `https://wa.me/${MEU_WHATSAPP}?text=${encodeURIComponent(msgErro)}`;
                    
                    erro.innerHTML = `
                        <div style="font-size: 4rem; margin-bottom: 10px;">😕</div>
                        <h3 style="color: #fff; font-size: 1.5rem; margin-bottom: 10px;">Ops! Não encontramos "${query}".</h3>
                        <p style="color: #aaa; margin-bottom: 20px;">Nosso estoque gira muito rápido. Quer confirmar com um vendedor?</p>
                        
                        <a href="${linkWppErro}" target="_blank" style="background: linear-gradient(90deg, #25D366, #1EBE55); color: white; padding: 15px 25px; border-radius: 8px; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); width: 100%; max-width: 400px; margin: 0 auto 30px;">
                            <img src="data/redes_sociais/whatsapp.png" width="24" height="24">
                            Consultar Estoque no WhatsApp
                        </a>
                        <div style="width: 100%; height: 1px; background: #333; margin: 20px 0;"></div>
                        <p style="color: #fff; font-weight: 600; margin-bottom: 15px;">Ou tente pesquisar outro modelo:</p>
                        <form class="beautiful-search" action="pesquisa.html" method="GET" style="margin-top: 0;">
                            <input type="text" name="q" placeholder="Ex: iPhone, Xiaomi..." required autocomplete="off">
                            <button type="submit">
                                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            </button>
                        </form>
                    `;
                    erro.style.display = 'block';
                }
            }, 1200);
        }
    </script>
</body>
</html>
