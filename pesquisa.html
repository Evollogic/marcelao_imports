<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados | Marcelão Imports</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="data/index_data/style.css?v=26">
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

    <header>
        <div class="logo">
            <a href="index.html"><img src="data/index_data/logo.png" alt="Marcelão Imports" style="max-height: 40px;"></a>
        </div>
        <nav>
            <a href="catalogo.html" data-i18n="nav_catalogo">⬅ Voltar ao Catálogo</a>
        </nav>
    </header>

    <section class="hero" style="padding: 40px 20px 20px; min-height: auto;">
        <div class="hero-content">
            <h2>Buscando por: <br><span class="gold-text" id="termo-buscado">...</span></h2>
        </div>
    </section>

    <!-- TELA DE CARREGAMENTO -->
    <div id="loading-container" class="loading-container" style="display: block;">
        <div class="loading-dots">
            <div></div><div></div><div></div>
        </div>
        <p style="color: var(--gold); margin-top: 15px; font-weight: 600; font-size: 1.2rem;">Verificando estoque no sistema...</p>
    </div>

    <!-- SESSÃO DE RESULTADOS -->
    <section id="resultados-section" style="padding-bottom: 60px;">
        <div class="products-grid" id="resultados-grid" style="display: none;"></div>
        
        <div id="erro-busca" style="display: none; text-align: center; padding: 40px 20px; max-width: 600px; margin: 0 auto;">
            <!-- Preenchido via JS dinamicamente -->
        </div>
    </section>

    <!-- RODAPÉ DA PESQUISA -->
    <footer class="footer-section">
        <div class="footer-grid">
            <div class="footer-col company-info" style="text-align: center; width: 100%;">
                <p style="font-size: 0.8rem; color: #888; margin-bottom: 10px;" data-i18n="lang_label">Mudar Idioma do Site:</p>
                <div style="display: flex; gap: 15px; align-items: center; justify-content: center;">
                    <button class="lang-btn" data-lang="pt" onclick="mudarIdioma('pt')">🇧🇷 PT</button>
                    <button class="lang-btn" data-lang="es" onclick="mudarIdioma('es')">🇵🇾 ES</button>
                    <button class="lang-btn" data-lang="en" onclick="mudarIdioma('en')">🇺🇸 EN</button>
                </div>
            </div>
        </div>
    </footer>

    <!-- Botão Zap Direita -->
    <a href="#" onclick="chamarZap('Atendimento Busca'); return false;" class="btn-whatsapp-float">
        <img src="data/redes_sociais/whatsapp.png" alt="WhatsApp" width="65" height="65">
    </a>

    <!-- Scripts Compartilhados -->
    <script src="whatsapp.js"></script>

    <!-- Lógica Global do WhatsApp Blindado -->
    <script>
        async function obterNumeroDoTxt() {
            try {
                const resposta = await fetch('whatsapp.txt?v=' + new Date().getTime());
                if (!resposta.ok) return null;
                const texto = await resposta.text();
                return texto.replace(/\D/g, '');
            } catch (erro) {
                return null;
            }
        }

        window.chamarZap = async function(produto) {
            let numero = await obterNumeroDoTxt();
            if (typeof NUMERO_WHATSAPP !== 'undefined') { 
                let jsNum = NUMERO_WHATSAPP.replace(/\D/g, ''); 
                if (jsNum) numero = jsNum;
            }

            if (!numero || numero.length < 10) {
                console.error("❌ ERRO GRAVE: Nenhum número válido encontrado. Abortando mensagem.");
                return; 
            }
            if (!numero.startsWith('55') && numero.length <= 11) { numero = '55' + numero; }

            let cliques = JSON.parse(localStorage.getItem('cliquesProdutos')) || {};
            cliques[produto] = (cliques[produto] || 0) + 1;
            localStorage.setItem('cliquesProdutos', JSON.stringify(cliques));

            let lang = localStorage.getItem('siteLang') || 'pt';
            let msg = `Olá, Marcelão Imports! Tenho interesse no: ${produto}`;
            if (lang === 'es') msg = `¡Hola, Marcelão Imports! Estoy interesado en: ${produto}`;
            else if (lang === 'en') msg = `Hi, Marcelão Imports! I am interested in: ${produto}`;

            window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, '_blank');
        };
    </script>

    <!-- Integração Direta com Wix SDK -->
    <script type="module">
        import { createClient, OAuthStrategy } from 'https://esm.sh/@wix/sdk@latest';
        import { products } from 'https://esm.sh/@wix/stores@latest';

        const CLIENT_ID = 'af0efa30-5a54-4813-a964-e064f08f8065';
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        
        function formatarImagemWix(wixUrl) {
            if (!wixUrl) return 'https://via.placeholder.com/300x300/ffffff/555555?text=Sem+Imagem';
            if (wixUrl.startsWith('http')) return wixUrl;
            if (wixUrl.startsWith('wix:image://v1/')) {
                const arquivo = wixUrl.split('/')[3].split('#')[0];
                return `https://static.wixstatic.com/media/${arquivo}`;
            }
            return 'https://via.placeholder.com/300x300/ffffff/555555?text=Sem+Imagem';
        }

        async function realizarBuscaWix() {
            const grid = document.getElementById('resultados-grid');
            const erro = document.getElementById('erro-busca');
            const loading = document.getElementById('loading-container');

            if (!query) {
                loading.style.display = 'none';
                document.getElementById('termo-buscado').innerText = "Busca Vazia";
                erro.innerHTML = '<h3 style="color: #fff;">Você não digitou nada na busca. Tente novamente!</h3>';
                erro.style.display = 'block';
                return;
            }

            document.getElementById('termo-buscado').innerText = '"' + query + '"';
            const qLower = query.toLowerCase().trim();

            try {
                const wixClient = createClient({
                    modules: { products },
                    auth: OAuthStrategy({ clientId: CLIENT_ID })
                });

                // Puxa do Wix e faz o filtro por nome e descrição
                const resposta = await wixClient.products.queryProducts().limit(100).find();
                
                const resultados = resposta.items.filter(p => {
                    const nome = (p.name || '').toLowerCase();
                    const desc = (p.description || '').toLowerCase();
                    return nome.includes(qLower) || desc.includes(qLower);
                });

                loading.style.display = 'none';

                if (resultados.length > 0) {
                    let htmlStr = '';
                    const imgStyle = `width: 100%; aspect-ratio: 1 / 1; display: flex; justify-content: center; align-items: center; background: #ffffff; border-radius: 8px; margin-bottom: 12px; overflow: hidden;`;

                    resultados.forEach(p => {
                        let precoOriginal = p.priceData?.formatted?.price || '0,00';
                        let precoDesconto = p.priceData?.formatted?.discountedPrice;
                        let pNovo = precoOriginal;
                        let pAntigo = null;

                        if (precoDesconto && precoDesconto !== precoOriginal) {
                            pNovo = precoDesconto;
                            pAntigo = precoOriginal;
                        }

                        pNovo = pNovo.replace('R$', '').replace('\u00A0', '').trim();
                        if (pAntigo) pAntigo = pAntigo.replace('R$', '').replace('\u00A0', '').trim();

                        const imgUrl = formatarImagemWix(p.media?.mainMedia?.image?.url || p.media?.items?.[0]?.image?.url);
                        const nome = p.name || 'Produto';
                        const desc = p.description ? p.description.replace(/<[^>]*>?/gm, '').substring(0, 65) + '...' : 'Qualidade e procedência garantida.';
                        const badge = p.ribbon || '';

                        let badgeHtml = badge ? `<span class="badge-stock badge-lancamento">${badge}</span>` : '';
                        let priceHtml = pAntigo 
                            ? `<div class="price-box-highlight normal-price"><span class="price-old" style="font-size: 0.85rem; color:#888;">De R$ ${pAntigo}</span><span class="price-new" style="font-size: 1.5rem; color: #fff;">Por R$ ${pNovo}</span></div>`
                            : `<div class="price-box-highlight normal-price"><span class="price-new" style="font-size: 1.5rem; color: #fff;">R$ ${pNovo}</span></div>`;

                        htmlStr += `
                            <div class="product-card normal-card">
                                ${badgeHtml}
                                <div style="${imgStyle}">
                                    <img src="${imgUrl}" alt="${nome}" style="width: 100%; height: 100%; object-fit: contain; padding: 10px;">
                                </div>
                                <h3 class="product-title">${nome}</h3>
                                <p class="product-desc">${desc}</p>
                                ${priceHtml}
                                <a href="#" class="btn-buy" onclick="chamarZap('${nome.replace(/'/g, "\\'")}'); return false;">Chamar no WhatsApp</a>
                            </div>
                        `;
                    });

                    grid.innerHTML = htmlStr;
                    grid.style.display = 'grid';
                } else {
                    // Produto Não Encontrado -> Link pro Vendedor
                    let numero = await obterNumeroDoTxt();
                    if (typeof NUMERO_WHATSAPP !== 'undefined') { 
                        let jsNum = NUMERO_WHATSAPP.replace(/\D/g, ''); 
                        if (jsNum) numero = jsNum;
                    }

                    if (!numero || numero.length < 10) numero = "5541992595757"; // Fallback seguro para não travar a página de erro
                    if (!numero.startsWith('55') && numero.length <= 11) { numero = '55' + numero; }

                    let lang = localStorage.getItem('siteLang') || 'pt';
                    let msgErro = `Olá, vocês têm o produto ${query} no estoque?`;
                    if (lang === 'es') msgErro = `Hola, ¿tienen el producto ${query} en stock?`;
                    if (lang === 'en') msgErro = `Hi, do you have the product ${query} in stock?`;
                    let linkWppErro = `https://wa.me/${numero}?text=${encodeURIComponent(msgErro)}`;
                    
                    erro.innerHTML = `
                        <div style="font-size: 4rem; margin-bottom: 10px;">😕</div>
                        <h3 style="color: #fff; font-size: 1.5rem; margin-bottom: 10px;">Ops! Não encontramos "${query}".</h3>
                        <p style="color: #aaa; margin-bottom: 20px;">Nosso estoque gira muito rápido. Quer confirmar com um vendedor?</p>
                        
                        <a href="${linkWppErro}" target="_blank" style="background: linear-gradient(90deg, #25D366, #1EBE55); color: white; padding: 15px 25px; border-radius: 8px; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); width: 100%; max-width: 400px; margin: 0 auto 30px;">
                            <img src="data/redes_sociais/whatsapp.png" width="24" height="24">
                            Consultar Estoque no WhatsApp
                        </a>
                        
                        <div style="width: 100%; height: 1px; background: #333; margin: 20px 0;"></div>
                        
                        <p style="color: #fff; font-weight: 600; margin-bottom: 15px;">Ou tente pesquisar outro modelo:</p>
                        <form class="beautiful-search" action="pesquisa.html" method="GET" style="margin-top: 0;">
                            <input type="text" name="q" placeholder="Ex: iPhone, Xiaomi..." required autocomplete="off">
                            <button type="submit">
                                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            </button>
                        </form>
                    `;
                    erro.style.display = 'block';
                }
            } catch (e) {
                console.error("❌ Erro ao buscar no Wix:", e);
                loading.style.display = 'none';
                erro.innerHTML = '<h3 style="color: #fff;">Erro ao conectar com a loja. Tente novamente mais tarde.</h3>';
                erro.style.display = 'block';
            }
        }

        // Dá um pequeno delay pra animação de busca aparecer pro cliente (fica mais profissional)
        setTimeout(realizarBuscaWix, 800);
    </script>
</body>
</html>
